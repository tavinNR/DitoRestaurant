<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>

<h1>Lista de Produtos</h1>

<a th:href="@{/produtos}">Produto</a>

<table border = "1">
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Ações</th>
    </tr>

    <tr th:each="p : ${produtos}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.nome}"></td>
      <td th:text="${p.preco}"></td>
      <td>
          <a th:href="@{/produtos/editar/{id}(id=${p.id})}">Editar</a>
          <a th:href="@{/produtos/excluir/{id}(id=${p.id})}">Excluir</a>
      </td>
    </tr>
</table>
<a th:href="@{/produtos/cadastrar}">Cadastrar Produto</a>

</body>
</html>
